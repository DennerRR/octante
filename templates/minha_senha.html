{% extends 'base.html' %}
{% block titulo %}Minha senha — Octante{% endblock %}
{% block conteudo %}
<section class="cartao caixa-login">
  <h1>Trocar minha senha</h1>
  {% if erro %}<p class="aviso-erro">{{ erro }}</p>{% endif %}
  <form method="post">
    <label>Senha atual <input type="password" name="atual" autocomplete="current-password" required></label>
    <label>Nova senha (mínimo 8 caracteres) <input type="password" name="senha" autocomplete="new-password" minlength="8" required></label>
    <label>Repita a nova senha <input type="password" name="confirmacao" autocomplete="new-password" minlength="8" required></label>
    <button class="botao" type="submit">Salvar</button>
  </form>
</section>
{% endblock %}
