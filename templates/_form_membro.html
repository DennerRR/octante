{% set x = m if m is defined and m else {} %}
<div class="grade-4">
  <label>Nome *<input name="nome" required value="{{ x.nome or '' }}"></label>
  <label>Papel<input name="papel" value="{{ x.papel or '' }}" placeholder="Ex.: Desenvolvedora back-end"></label>
  <label>Dedicação
    <select name="dedicacao">{% for k, v in pmbok.DEDICACOES %}<option value="{{ k }}" {{ 'selected' if x.dedicacao == k }}>{{ v }}</option>{% endfor %}</select></label>
  <label>Local
    <select name="local">{% for k, v in pmbok.LOCAIS %}<option value="{{ k }}" {{ 'selected' if x.local == k }}>{{ v }}</option>{% endfor %}</select></label>
</div>
{% set us = usuarios_ativos() %}
{% if us %}
<label>Usuário do app <span class="ajuda">Ligue o membro ao login dele: assim os itens em que ele é responsável aparecem em “Minhas pendências”.</span>
  <select name="usuario_id"><option value="">— não usa o app —</option>{% for u in us %}<option value="{{ u.id }}" {{ 'selected' if x.usuario_id == u.id }}>{{ u.nome }} ({{ u.login }})</option>{% endfor %}</select></label>
{% endif %}
<div class="grade-2">
  <label>Habilidades<input name="habilidades" value="{{ x.habilidades or '' }}" placeholder="Ex.: Python, testes automatizados"></label>
  <label>Lacunas de habilidade <span class="ajuda">O que falta para o papel (2.2.1.3)</span><input name="lacunas" value="{{ x.lacunas or '' }}"></label>
  <label>Plano de desenvolvimento <span class="ajuda">Treinamento, mentoria ou coaching</span><input name="plano_desenvolvimento" value="{{ x.plano_desenvolvimento or '' }}"></label>
  <label>Motivador principal <span class="ajuda">Motivação intrínseca (2.2.4.3)</span>
    <select name="motivador"><option value="">—</option>{% for v in pmbok.MOTIVADORES %}<option {{ 'selected' if x.motivador == v }}>{{ v }}</option>{% endfor %}</select></label>
</div>
<label>Também é parte interessada registrada
  <select name="parte_id"><option value="">—</option>{% for s in partes %}<option value="{{ s.id }}" {{ 'selected' if x.parte_id == s.id }}>{{ s.nome }}</option>{% endfor %}</select></label>
